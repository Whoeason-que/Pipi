[package]
name = "pipi"
version = "26.9.3"
description = "一个以 Agent 为中心的本地优先桌面应用"
edition = "2021"

[lib]
name = "pipi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
pipi-core = { path = "../crates/pipi-core" }
pipi-app = { path = "../crates/pipi-app" }
