[workspace]
resolver = "3"
members = [
    "crates/pipi-context",
    "crates/pipi-protocol",
    "crates/pipi-session",
    "crates/pipi-forum",
    "crates/pipi-tools",
    "crates/pipi-venv",
    "crates/pipi-provider",
    "crates/pipi-test-support",
    "crates/pipi-agent",
    "crates/pipi-core",
    "crates/xtask",
    "crates/pipi",
]

# 版本与 edition 只在这里写一次，成员用 `version.workspace = true` 继承。
[workspace.package]
version = "26.10.1"
edition = "2024"
# 当前依赖树要求的最低 rustc（edition 2024 本身只要 1.85；这里被 rig 0.43
# 整套抬到 1.95）。依赖升级抬高它时，这里同步更新。
rust-version = "1.95"

# 依赖版本只在这里写一次，成员用 `{ workspace = true }` 继承；成员追加的
# features 是叠加（不是覆盖）。
#
# 注意 `default-features`：成员里写的值只有在工作区条目里也显式写了才生效，
# 否则会被静默忽略、默认特性照开。av 与 reqwest 依赖这条维持「不同成员用不同
# 默认特性」（见各自条目），新增依赖时别顺手删掉。
[workspace.dependencies]
# 内部 crate：路径只写一次
pipi-agent = { path = "crates/pipi-agent" }
pipi-context = { path = "crates/pipi-context" }
pipi-core = { path = "crates/pipi-core" }
pipi-protocol = { path = "crates/pipi-protocol" }
pipi-session = { path = "crates/pipi-session" }
pipi-forum = { path = "crates/pipi-forum" }
pipi-provider = { path = "crates/pipi-provider" }
pipi-test-support = { path = "crates/pipi-test-support" }
pipi-tools = { path = "crates/pipi-tools" }
pipi-venv = { path = "crates/pipi-venv", default-features = false }

# 第三方
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
libc = "0.2"
# 只用于解析用户 HOME（`~/.pipi` / `~/.av` 的数据根）：换 std 的同名函数在
# Windows 上走另一套 API，而 tauri 自身也依赖 dirs，留着它零成本
dirs = "7"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.3"
http = "1"
infer = "0.22"
nix = { version = "0.31", default-features = false, features = ["signal"] }
regex = "1.13"
# 与 rig 同一版本（0.13 起 TLS 特性改名为 rustls）：两个版本会让同一进程里
# 存在两套 HTTP/TLS 栈。pipi-provider 需要默认特性，pipi-core 不要默认特性，
# 所以这里显式写 default-features = false，provider 再覆盖回 true。
reqwest = { version = "0.13", default-features = false }
rig = "0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
similar = "3.2"
tauri = { version = "2", features = [] }
tauri-build = "2"
tempfile = "3"
tokio = { version = "1" }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

pedantic = { level = "deny", priority = -1 }

cargo = { level = "warn", priority = -1 }
# Internal, unpublished workspace crates: package metadata and duplicate
# transitive versions are not actionable here.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

todo = "deny"
unimplemented = "deny"

dbg_macro = "deny"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Pervasive in quantitative hot loops where bounds are validated by
# construction; enforcing `.get()` everywhere obscures the numerical code.
indexing_slicing = "allow"
# f64 accumulators are the intended data model (prices, P&L, metrics).
cast_precision_loss = "allow"
# Internal crates: rely on module-level docs instead of per-function boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Data plumbing encodes rows/segments/codes by construction; call sites bound the
# values before conversion (u32 code indices, usize tape offsets, i64 timestamps).
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Protocol/report builders are sequential by nature; splitting them obscures flow.
too_many_lines = "allow"



[profile.dev]
opt-level = 1
debug = true
lto = "off"
panic = "unwind"
strip = false
incremental = true
overflow-checks = true
debug-assertions = true
split-debuginfo = "off"


[profile.release]
opt-level = 3
debug = false
lto = "off"
panic = "abort"
strip = true
incremental = true
overflow-checks = false
debug-assertions = false
split-debuginfo = "off"