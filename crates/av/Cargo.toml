[package]
name = "av"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Agent 运行时环境契约：agent.toml 的解析、发现、合并、环境解析与技能包管理"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true }
# skills.sh 搜索客户端；pipi-core 以 default-features = false 依赖，不链入应用
ureq = { workspace = true, optional = true }

[features]
default = ["search"]
search = ["dep:ureq"]

[lib]
name = "av"
path = "src/lib.rs"

[[bin]]
name = "av"
path = "src/main.rs"
