[package]
name = "av"
version = "26.9.3"
description = "Agent 运行时环境契约：agent.toml 的解析、发现、合并与环境解析"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
glob = "0.3"

[lib]
name = "av"
path = "src/lib.rs"

[[bin]]
name = "av"
path = "src/main.rs"
