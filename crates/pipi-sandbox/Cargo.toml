[package]
name = "pipi-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi 的 OS 级沙箱：SandboxPolicy 编译为 Landlock/Seatbelt 能力，并提供 helper 二进制"

[lib]
name = "pipi_sandbox"
path = "src/lib.rs"

[[bin]]
name = "pipi-sandbox"
path = "src/main.rs"

[dependencies]
pipi-protocol = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
pipi-test-support = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
libc = { workspace = true }
seccompiler = { workspace = true }
