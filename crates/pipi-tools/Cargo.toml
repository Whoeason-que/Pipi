[package]
name = "pipi-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi 的内置工具实现（端口/权限数据在契约层，执行边界在 pipi-sandbox）"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
infer = { workspace = true }
pipi-protocol = { workspace = true }
pipi-sandbox = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
unicode-normalization = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
rustix = { workspace = true }

[dev-dependencies]
pipi-test-support = { workspace = true }
