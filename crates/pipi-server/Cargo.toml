[package]
name = "pipi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi 的 Web/远程运行时服务"

[[bin]]
name = "pipi-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
pipi-core = { workspace = true }
pipi-app = { workspace = true }
pipi-protocol = { workspace = true }
pipi-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { workspace = true }
tower = { workspace = true }
