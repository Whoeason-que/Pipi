[package]
name = "pipi-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP（Model Context Protocol）stdio 客户端：JSON-RPC 分帧、请求多路复用与工具调用"

[dependencies]
# 只做协议与进程管理，不依赖任何 Pipi crate：装配（沙箱、env、工作目录）由宿主负责。
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# 进程组收尾（与 pipi-tools::process 同一手法；这里不引 pipi-tools 以保持零 Pipi 依赖）。
nix = { workspace = true }

[[bin]]
# 测试用的假 MCP 服务器（也方便手工验证）；不参与库 API。
name = "mock_mcp_server"
path = "src/bin/mock_mcp_server.rs"
