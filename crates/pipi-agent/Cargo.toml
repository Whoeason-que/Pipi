[package]
name = "pipi-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi Agent 引擎：主循环与用量统计"

[dependencies]
pipi-context = { workspace = true }
pipi-error = { workspace = true }
pipi-protocol = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }

[dev-dependencies]
async-trait = { workspace = true }
# 只有测试需要具体 provider（生产代码只依赖协议层的 Provider 端口）
pipi-provider = { workspace = true }
