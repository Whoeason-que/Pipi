[package]
name = "pipi-core"
version = "26.9.3"
description = "Pipi 核心：从 pi 移植的 agent 循环、工具与 LLM provider 层"
edition = "2021"

[dependencies]
av = { path = "../av" }
pipi-error = { path = "../pipi-error" }
pipi-protocol = { path = "../pipi-protocol" }
pipi-tools = { path = "../pipi-tools" }
pipi-harness = { path = "../pipi-harness" }
pipi-provider = { path = "../pipi-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
