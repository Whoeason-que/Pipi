[package]
name = "pipi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi 核心：从 pi 移植的 agent 循环、工具与 LLM provider 层"

[dependencies]
# search feature 关闭：skills.sh 搜索只属于 av CLI，不把第二个 HTTP 栈链进应用
# （工作区条目里写的 default-features = false 就是为这条服务）
av = { workspace = true }
pipi-error = { workspace = true }
pipi-protocol = { workspace = true }
pipi-tools = { workspace = true }
pipi-harness = { workspace = true }
pipi-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
futures-util = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }

[dev-dependencies]
# 只有测试用它定位用户 HOME（agents.rs 的 HOME_LOCK 用例）
dirs = { workspace = true }
