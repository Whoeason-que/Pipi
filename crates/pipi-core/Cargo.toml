[package]
name = "pipi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pipi 宿主层：命令表、运行编排、后台任务、设置、Web 宿主（feature）"

[features]
default = []
# Web/远程宿主（axum transport + 鉴权 + 静态资源）；桌面壳不需要它。
# tokio/net 显式声明（`server/mod.rs` 用 `tokio::net::TcpListener`），
# 不靠 axum 的默认特性顺带打开。
server = ["dep:axum", "dep:tower-http", "tokio/net"]

[[bin]]
name = "pipi-server"
path = "src/bin/pipi-server.rs"
required-features = ["server"]

[dependencies]
# search feature 关闭：skills.sh 搜索只属于 av CLI，不把第二个 HTTP 栈链进应用
# （工作区条目里写的 default-features = false 就是为这条服务）
pipi-agent = { workspace = true }
pipi-context = { workspace = true }
pipi-forum = { workspace = true }
pipi-protocol = { workspace = true }
pipi-provider = { workspace = true }
pipi-session = { workspace = true }
pipi-tools = { workspace = true }
pipi-venv = { workspace = true }
async-trait = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# fs：background 的落盘与扫描用 `tokio::fs`，显式声明（此前靠 pipi-tools 传递开启）
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }

# 只有 server feature 用得到（tower 仅测试用）
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
pipi-test-support = { workspace = true }
tower = { workspace = true }
