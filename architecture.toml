# 工作区分层与依赖方向 —— `cargo xtask arch` 按本文件检查。
#
# 规则：
# - `may-depend-on`：**内部** crate 依赖白名单。没列出的内部依赖一律违规。
# - `dev-may-depend-on`：dev-dependencies 里的内部依赖白名单（默认空）。
# - `forbid`：点名的第三方依赖，出现在**生产依赖**里即违规（dev-dependencies
#   不进产物，测试用运行时之类不受此限；内部依赖已由白名单覆盖，不必重复）。
#
# 每个工作区成员都必须在这里登记；新增 crate 或改依赖前先更新本文件，再跑
# `cargo xtask arch`。这是边界，不是建议 —— 想放宽先改这里并说明理由。

# 仓库维护任务（cargo xtask arch 自身），不依赖任何 Pipi crate。
[crates.xtask]
may-depend-on = []

# 叶子：跨层稳定错误语义。除 serde 外不依赖任何东西。
[crates.pipi-error]
may-depend-on = []

# 叶子：测试脚手架，不依赖任何东西。
[crates.pipi-test-support]
may-depend-on = []

# 契约层：DTO 与 wire 形状、会话条目格式与存储端口、工具/权限/provider 端口，
# 以及跨层共用的零依赖助手（fs 守卫、文本转义、id）。不放任何实现 crate。
[crates.pipi-protocol]
may-depend-on = ["pipi-error"]
dev-may-depend-on = ["pipi-test-support"]
# tokio 只允许 sync（Provider 端口的事件流通道）；rt / net / time 不得出现。
forbid = ["av", "pipi-tools", "pipi-core", "pipi-agent", "reqwest", "rig"]

# 上下文与运行策略：token 预算 / 裁剪与配对修复 / 压缩流水线 / 重试退避。
# 只依赖契约层：不碰载体、不直连网络、不落盘。
[crates.pipi-context]
may-depend-on = ["pipi-error", "pipi-protocol"]
dev-may-depend-on = ["pipi-session", "pipi-test-support"]

# 会话载体：JSONL 文件（未来的 git 分支同属这里）。只实现契约层的存储端口，
# 也是唯一允许 spawn git 的 crate（见 docs/git-session-store.md）。
[crates.pipi-session]
may-depend-on = ["pipi-protocol"]
dev-may-depend-on = ["pipi-test-support"]

# 内置工具实现与 bash 权限策略（端口与权限数据在契约层）。
[crates.pipi-tools]
may-depend-on = ["pipi-protocol"]
dev-may-depend-on = ["pipi-test-support"]

# 模型面：rig 的 HTTP/SSE 适配与错误分类（不做重发）+ models.dev 模型目录。
[crates.pipi-provider]
may-depend-on = ["pipi-error", "pipi-protocol"]

# 引擎：主循环与用量统计。上下文 / 压缩 / 重试在 pipi-context，载体在
# pipi-session；不碰 agent.toml 契约、不直连网络（provider 只以契约层端口出现）。
[crates.pipi-agent]
may-depend-on = ["pipi-context", "pipi-error", "pipi-protocol"]
dev-may-depend-on = ["pipi-provider", "pipi-session", "pipi-test-support"]
forbid = ["av", "reqwest"]

# 宿主层：命令表、运行编排、后台任务、设置、Agent 组合工具，以及
# `--features server` 的 Web 宿主（只做 transport 与鉴权）。
[crates.pipi-core]
may-depend-on = [
    "pipi-agent",
    "pipi-context",
    "pipi-protocol",
    "pipi-provider",
    "pipi-session",
    "pipi-tools",
    "pipi-venv",
]
dev-may-depend-on = ["pipi-test-support"]
forbid = ["rig"]

# Agent 环境域：清单与注册表、agent.toml 契约（含 av CLI）、技能中心、提示词层。
# 只依赖契约层与内置工具助手；不直连网络（search 特性默认关闭）之外无运行时。
[crates.pipi-venv]
may-depend-on = ["pipi-protocol", "pipi-tools"]
dev-may-depend-on = ["pipi-test-support"]
forbid = ["reqwest", "rig", "tokio"]

# Tauri 薄壳：commands.rs 只做 IPC 转发。
[crates.pipi]
may-depend-on = [
    "pipi-agent",
    "pipi-core",
    "pipi-provider",
    "pipi-protocol",
    "pipi-tools",
    "pipi-venv",
]
